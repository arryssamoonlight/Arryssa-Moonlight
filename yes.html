
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just deeper about me</title>
<link rel="icon" type="image/png" href="logo1.png">

<style>
:root {
    --dark: #100e12;
    --card: #1c1920;
    --inner: #25212a;
    --beige: #d8c8ad;
    --cream: #f5efe6;
    --lavender: #b9a4ce;
    --grey: #a69b9b;
    --border: #d8c8ad;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "MV Boli", sans-serif;
    color: var(--cream);
    background-color: var(--dark);
    background-image:
        radial-gradient(ellipse at 15% 20%, #493a4d55 0%, transparent 42%),
        radial-gradient(ellipse at 85% 75%, #806c4b22 0%, transparent 40%);
    text-align: center;
    overflow-x: hidden;
}

.container {
    width: 90%;
    max-width: 550px;
    margin: 60px auto;
    padding: 30px 22px;
    background: rgba(28, 25, 32, 0.94);
    border: 2px solid var(--border);
    border-radius: 25px;
    box-shadow:
        0 8px 30px #00000088,
        0 0 25px #b9a4ce15;
    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-size: 30px;
    margin-bottom: 8px;
    color: var(--beige);
}

.subtitle {
    color: var(--lavender);
    font-size: 14px;
    margin-bottom: 25px;
}

.about {
    text-align: center;
    background: var(--inner);
    border: 1px solid #75677a;
    border-radius: 18px;
    padding: 25px 20px;
    line-height: 1.8;
    font-size: 14px;
    min-height: 300px;
    color: var(--cream);
}

.about h2 {
    color: var(--beige);
    font-size: 17px;
    margin: 18px 0 5px;
}

.separator {
    color: var(--lavender);
    margin: 12px 0;
}

footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--grey);
}

@media (max-width: 600px) {
    .container {
        width: 92%;
        padding: 25px 17px;
        margin: 35px auto;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Just deeper me because I am NOT all sunshine and rainbows</h1>

    <div class="subtitle">
       Tw!<br>

    <footer>

</body>
</html>
