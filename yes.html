* { box-sizing:border-box; }

body {

.book {

}

.frame {
  position:absolute;
  inset:0;
  overflow:hidden;
  border:2px solid var(--beige);
  border-radius:5px;
  background:var(--cream);
  box-shadow:0 18px 45px #0008;
}

.spread {
  position:absolute;
  inset:0;
  display:flex;
  z-index:3;
}

.page {
  width:50%;
  height:100%;
  padding:clamp(15px,4vw,35px);
  overflow:hidden;
  background:var(--cream);
  color:var(--purple);
}

.page.left { border-right:1px solid var(--beige); }
.page.right { border-left:1px solid var(--beige); }

.page h2,
.sheet-face h2 {
  color:var(--purple);

  margin-top:0;
}

.page p,
.sheet-face p {
  color:var(--grey);
  font-size:clamp(12px,2vw,16px);
  line-height:1.7;
  overflow-wrap:anywhere;
}

.page-content {
  overflow:hidden;
  height:100%;
}

.closed-left {
  position:absolute;
  top:0;
  left:0;
  width:50%;
  height:100%;
  background:var(--inner);
  z-index:5;
}

.front-cover {
  position:absolute;
  top:0;
  left:50%;
  width:50%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.4s cubic-bezier(.65,0,.25,1);
  z-index:10;
}

.front-cover.open { transform:rotateY(-180deg); }

.cover-face {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  border:1px solid var(--beige);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}

.cover-front {
  background:var(--cover);
  color:var(--beige);
  overflow:hidden;
  isolation:isolate;
}

.cover-front::before,
.back-cover::before {
  content:"✧  ✿  ✧";
  position:absolute;
  inset:15px 12px;
  border:1px solid #d8c8ad99;
  outline:1px solid #b9a4ce55;

  display:flex;

  padding-top:16px;
  color:var(--lavender);
  font-size:clamp(13px,2.3vw,20px);
  letter-spacing:9px;
  pointer-events:none;
  z-index:-1;
}

.cover-front::after,
.back-cover::after {
  content:"☾";
  position:absolute;
  top:21%;
  left:50%;
  transform:translateX(-50%);
  color:var(--beige);
  font-size:clamp(42px,7vw,68px);
  line-height:1;
  text-shadow:0 0 12px #d8c8ad88,0 0 28px #b9a4ce77;
  pointer-events:none;
}

.cover-front h2 {
  position:relative;
  margin:65px 0 8px;
  font-size:clamp(17px,3.5vw,29px);
  letter-spacing:2px;

.cover-front p {

}

.cover-inside {

.cover-inside h2 { color:var(--purple); }

.cover-inside p {

}

.cover-inside .page-one-content {

}

.sheet {
  position:absolute;
  top:0;
  left:50%;
  width:50%;
  height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
  display:none;
  z-index:7;
}

.sheet.forward {
  display:block;
  animation:forward 1.15s cubic-bezier(.65,0,.25,1) forwards;
}

.sheet.backward {
  display:block;
  animation:backward 1.15s cubic-bezier(.65,0,.25,1) forwards;
}

.sheet-face {
  position:absolute;
  inset:0;
  padding:clamp(15px,4vw,35px);
  background:var(--cream);
  color:var(--purple);
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-left:1px solid var(--beige);
}

.sheet-back { transform:rotateY(180deg); }

@keyframes forward {
  from { transform:rotateY(0deg); }
  to { transform:rotateY(-180deg); }
}

@keyframes backward {
  from { transform:rotateY(-180deg); }
  to { transform:rotateY(0deg); }
}

.back-cover {
  position:absolute;
  top:0;
  left:0;
  width:50%;
  height:100%;
  visibility:hidden;
  transform-origin:right center;
  transform:rotateY(-180deg);
  transition:
    transform 1.15s cubic-bezier(.65,0,.25,1),

  backface-visibility:hidden;

  background:var(--cover);

}

.back-cover.visible {

}

.back-cover h2 {

.back-cover p {

#status {

#measure {

@media (max-width:500px) {

const frame = document.getElementById("frame");
const spread = document.getElementById("spread");
const frontCover = document.getElementById("frontCover");
const closedLeft = document.getElementById("closedLeft");
const pageOne = document.getElementById("pageOne");
const leftPage = document.getElementById("leftPage");
const leftContent = document.getElementById("leftContent");
const rightContent = document.getElementById("rightContent");
const sheet = document.getElementById("sheet");
const sheetFront = document.getElementById("sheetFront");
const sheetBack = document.getElementById("sheetBack");
const backCover = document.getElementById("backCover");

const nextBtn = document.getElementById("nextBtn");

const status = document.getElementById("status");
const measure = document.getElementById("measure");

const moonMessage = document.getElementById("moonMessage");
const sendMessage = document.getElementById("sendMessage");
const messageAnimation = document.getElementById("messageAnimation");

let pages = [];
let turn = 0;
let opened = false;
let animating = false;
let showingBack = false;

function makePageHTML(title, content, headingSize) {
  return `
    ${title ? `<h2 style="font-size:${headingSize}px">${title}</h2>` : ""}
    ${content}
  `;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function splitIntoPages() {
  const book = document.querySelector(".book");
  const bookWidth = book.clientWidth;
  const pageWidth = bookWidth / 2;
  const pagePadding = Math.min(35, Math.max(15, bookWidth * 0.04));
  const contentWidth = pageWidth - pagePadding * 2;
  const contentHeight = book.clientHeight - pagePadding * 2;
  const fontSize = Math.max(12, Math.min(16, bookWidth * 0.021));
  const headingSize = Math.max(17, Math.min(25, bookWidth * 0.033));

  measure.style.width = contentWidth + "px";
  measure.style.padding = "0";
  measure.style.fontFamily = getComputedStyle(document.body).fontFamily;
  measure.style.fontSize = fontSize + "px";
  measure.style.lineHeight = "1.7";

  function fits(html) {
    measure.innerHTML = html;
    return measure.scrollHeight <= contentHeight;
  }

  function buildEntryPages(title, text, chapterTitle) {
    const result = [];
    const words = text.trim().split(/\s+/);
    let current = "";
    let currentTitle = title;

    function addPage(html, heading) {
      result.push({
        title: heading,
        chapterTitle,
        html: makePageHTML(heading, html, headingSize)
      });
    }

    for (const word of words) {
      const candidate = current ? current + " " + word : word;
      const html = `<p>${candidate}</p>`;
      const full = makePageHTML(currentTitle, html, headingSize);

      if (fits(full)) {
        current = candidate;
      } else {
        if (current) {
          addPage(`<p>${current}</p>`, currentTitle);
          currentTitle = "";
        }

        current = word;
      }
    }

    if (current) {
      addPage(`<p>${current}</p>`, currentTitle);
    }

    if (result.length === 0) {
      addPage("", title);
    }

    return result;
  }

  // Build all normal chapters first.
  const normalPages = [];
  const indexPosition = bookContent.findIndex(
    entry => entry.title.trim().toLowerCase() === "index"
  );

  let insertionPoint = 0;

  bookContent.forEach((entry, i) => {
    if (i === indexPosition) {
      insertionPoint = normalPages.length;
      return;
    }

    const chapterPages = buildEntryPages(
      entry.title,
      entry.text,
      entry.title
    );

    normalPages.push(...chapterPages);
  });

  if (indexPosition === -1) {
    insertionPoint = normalPages.length;
  }

  // Generate the index and calculate its page count.
  let indexPages = [];
  let indexPageCount = 1;

  for (let attempt = 0; attempt < 10; attempt++) {
    const chapterStarts = new Map();

    normalPages.forEach((page, i) => {
      if (!chapterStarts.has(page.chapterTitle)) {
        const finalIndex = i >= insertionPoint
          ? i + indexPageCount
          : i;

        chapterStarts.set(page.chapterTitle, finalIndex);
      }
    });

    const indexText = [...chapterStarts.entries()]
      .map(([title, pageIndex]) => {
        const spreadNumber = Math.floor(pageIndex / 2) + 1;

        return `✧ ${escapeHTML(title)} · Spread ${spreadNumber}`;
      })
      .join(" <br> ");

    const newIndexPages = buildEntryPages(
      "Index",
      indexText,
      "Index"
    );

    indexPages = newIndexPages;

    if (newIndexPages.length === indexPageCount) {
      break;
    }

    indexPageCount = newIndexPages.length;
  }

  // Insert the automatically generated index.
  const allPages = [...normalPages];

  allPages.splice(
    insertionPoint,
    0,
    ...indexPages
  );

  // Page One stays attached to the inside of the front cover.
  pageOne.innerHTML = allPages.shift()?.html || "";

  pages = allPages;

  if (pages.length === 0) {
    pages.push({ title: "", html: "", chapterTitle: "" });
  }

  // Keep the final spread balanced.
  if (pages.length % 2 !== 0) {
    pages.push({
      title: "",
      html: "",
      chapterTitle: ""
    });
  }

  turn = 0;
  renderSpread();
  updateControls();
}

function renderSpread() {
  if (turn === 0) {
    leftContent.innerHTML = "";
    leftPage.style.background = "transparent";
    leftPage.style.border = "none";
    rightContent.innerHTML = pages[0]?.html || "";
  } else {
    const leftIndex = turn * 2 - 1;
    const rightIndex = turn * 2;

    leftPage.style.background = "var(--cream)";
    leftPage.style.borderRight = "1px solid var(--beige)";

    leftContent.innerHTML = pages[leftIndex]?.html || "";
    rightContent.innerHTML = pages[rightIndex]?.html || "";
  }
}

function totalTurns() {
  return Math.ceil(pages.length / 2);
}

function updateControls() {
  prevBtn.disabled = animating || (!opened && !showingBack);
  nextBtn.disabled = animating;

  if (showingBack) {
    nextBtn.disabled = true;
    nextBtn.textContent = "Finished";
    status.textContent = "THE END";
    return;
  }

  if (!opened) {
    nextBtn.textContent = "Open Book →";
    status.textContent = "CLOSED";
    return;
  }

  nextBtn.textContent = turn >= totalTurns()
    ? "Back Cover →"
    : "Next Page →";

  status.textContent = `SPREAD ${turn + 1}`;
}

function waitForTransition(element, property, callback) {
  const handler = event => {
    if (event.target !== element || event.propertyName !== property) return;
    element.removeEventListener("transitionend", handler);
    callback();
  };

  element.addEventListener("transitionend", handler);
}

function openBook() {
  if (animating || opened) return;

  animating = true;
  updateControls();

  frontCover.classList.add("open");

  waitForTransition(frontCover, "transform", () => {
    opened = true;
    frontCover.style.zIndex = "2";
    closedLeft.style.display = "none";
    renderSpread();
    animating = false;
    updateControls();
  });
}

function turnPage() {
  if (animating || !opened || showingBack) return;

  if (turn >= totalTurns()) {
    showingBack = true;
    animating = true;
    spread.style.display = "none";
    frame.style.background = "var(--inner)";
    backCover.classList.add("visible");

    waitForTransition(backCover, "transform", () => {
      animating = false;
      updateControls();
    });

    updateControls();
    return;
  }

  animating = true;
  updateControls();

  const frontIndex = turn * 2;
  const backIndex = frontIndex + 1;

  sheetFront.innerHTML = pages[frontIndex]?.html || "";
  sheetBack.innerHTML = pages[backIndex]?.html || "";

  sheet.classList.remove("forward", "backward");
  sheet.style.display = "block";
  sheet.style.transform = "";

  void sheet.offsetWidth;
  sheet.classList.add("forward");

  sheet.addEventListener("animationend", function done(event) {
    if (event.animationName !== "forward") return;

    sheet.removeEventListener("animationend", done);

    turn++;
    renderSpread();

    sheet.classList.remove("forward");
    sheet.style.display = "none";
    sheet.style.transform = "";

    animating = false;
    updateControls();
  });
}

function previousPage() {
  if (animating) return;

  if (showingBack) {
    animating = true;
    updateControls();

    backCover.classList.remove("visible");

    waitForTransition(backCover, "transform", () => {
      showingBack = false;
      spread.style.display = "flex";
      frame.style.background = "var(--cream)";
      animating = false;
      updateControls();
    });

    return;
  }

  if (!opened) return;

  if (turn > 0) {
    animating = true;
    updateControls();

    const previousLeftIndex = turn * 2 - 1;
    const previousRightIndex = turn * 2;

    sheetFront.innerHTML = pages[previousLeftIndex]?.html || "";
    sheetBack.innerHTML = pages[previousRightIndex]?.html || "";

    sheet.classList.remove("forward", "backward");
    sheet.style.display = "block";
    sheet.style.transform = "rotateY(-180deg)";

    void sheet.offsetWidth;
    sheet.classList.add("backward");

    sheet.addEventListener("animationend", function done(event) {
      if (event.animationName !== "backward") return;

      sheet.removeEventListener("animationend", done);

      turn--;
      renderSpread();

      sheet.classList.remove("backward");
      sheet.style.display = "none";
      sheet.style.transform = "";

      animating = false;
      updateControls();
    });

    return;
  }

  animating = true;
  updateControls();

  frontCover.style.zIndex = "10";
  closedLeft.style.display = "block";
  frontCover.classList.remove("open");

  waitForTransition(frontCover, "transform", () => {
    opened = false;
    animating = false;
    updateControls();
  });
}

nextBtn.addEventListener("click", () => {
  if (!opened) openBook();
  else turnPage();
});

prevBtn.addEventListener("click", previousPage);

sendMessage.addEventListener("click", () => {

  messageAnimation.classList.remove("play");
  void messageAnimation.offsetWidth;
  messageAnimation.classList.add("play");
});

window.addEventListener("load", () => {
  splitIntoPages();
  updateControls();
});

let resizeTimer;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    if (!opened && !animating) splitIntoPages();
  }, 200);
});


</script>
</body>
</html>
